name: Weekly review roundup

on:
  schedule:
    # Sundays 7pm UK time. GitHub often starts scheduled runs hours late, so
    # the run is triggered early (13:47 UTC, an off-peak minute) and the first
    # step waits until 19:00 Europe/London (BST or GMT). If GitHub starts it
    # after 19:00, the roundup is sent immediately instead of being skipped.
    - cron: "47 13 * * 0"
  workflow_dispatch:         # allows manual "Run workflow" button
    inputs:
      test_fake_reviews:
        description: "Test mode: add a fake review to this many random hotels (0 = normal run)"
        default: "0"

permissions:
  contents: write            # commit state.json back
  issues: write              # open the roundup issue
  models: read               # summarize new reviews with GitHub Models

jobs:
  roundup:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Wait until 7pm UK time
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=Europe/London date -d "today 19:00" +%s)
          now=$(date +%s)
          wait=$((target - now))
          if [ "$wait" -gt 0 ] && [ "$wait" -lt 21000 ]; then
            echo "Waiting $((wait / 60)) minutes until 19:00 London time."
            sleep "$wait"
          else
            echo "Started at $(TZ=Europe/London date +%H:%M) London time; sending now."
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build weekly roundup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL }}
          BV_PASSKEY_IHG: ${{ secrets.BV_PASSKEY_IHG }}
          TEST_FAKE_REVIEWS: ${{ inputs.test_fake_reviews || '0' }}
        run: python weekly_roundup.py

      - name: Open roundup issue (GitHub emails you the issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f roundup.md ]; then
            # The @mention triggers a "participating" email,
            # which arrives even when watch notifications don't.
            { echo "@$GITHUB_REPOSITORY_OWNER"; echo; cat roundup.md; } > issue_body.md
            gh issue create \
              --title "$(cat roundup_title.txt)" \
              --body-file issue_body.md \
              --repo "$GITHUB_REPOSITORY"
            rm -f roundup.md roundup_title.txt issue_body.md
          else
            echo "No roundup to send."
          fi

      - name: Commit updated state
        run: |
          git config user.name "review-bot"
          git config user.email "actions@github.com"
          if [ ! -f state.json ]; then
            echo "No state to commit (test run)."
            exit 0
          fi
          git add state.json
          git diff --cached --quiet || git commit -m "Update weekly review state [skip ci]"
          git push
