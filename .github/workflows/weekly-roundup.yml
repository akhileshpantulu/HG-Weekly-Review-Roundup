name: Weekly review roundup

on:
  schedule:
    # Sundays 7pm UK time. Cron runs in UTC, so both 18:00 UTC (7pm BST) and
    # 19:00 UTC (7pm GMT) are scheduled; the uk-time job lets only the one
    # that lands at 7pm in London through.
    - cron: "0 18 * * 0"
    - cron: "0 19 * * 0"
  workflow_dispatch:         # allows manual "Run workflow" button
    inputs:
      test_fake_reviews:
        description: "Test mode: add a fake review to this many random hotels (0 = normal run)"
        default: "0"

permissions:
  contents: write            # commit state.json back
  issues: write              # open the roundup issue
  models: read               # summarize new reviews with GitHub Models

jobs:
  uk-time:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          hour=$(TZ=Europe/London date +%H)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$hour" = "19" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "It is ${hour}:00 in London, not 19:00. Skipping this scheduled run."
          fi

  roundup:
    needs: uk-time
    if: needs.uk-time.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build weekly roundup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL }}
          BV_PASSKEY_IHG: ${{ secrets.BV_PASSKEY_IHG }}
          TEST_FAKE_REVIEWS: ${{ inputs.test_fake_reviews || '0' }}
        run: python weekly_roundup.py

      - name: Open roundup issue (GitHub emails you the issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f roundup.md ]; then
            # The @mention triggers a "participating" email,
            # which arrives even when watch notifications don't.
            { echo "@$GITHUB_REPOSITORY_OWNER"; echo; cat roundup.md; } > issue_body.md
            gh issue create \
              --title "$(cat roundup_title.txt)" \
              --body-file issue_body.md \
              --repo "$GITHUB_REPOSITORY"
            rm -f roundup.md roundup_title.txt issue_body.md
          else
            echo "No roundup to send."
          fi

      - name: Commit updated state
        run: |
          git config user.name "review-bot"
          git config user.email "actions@github.com"
          if [ ! -f state.json ]; then
            echo "No state to commit (test run)."
            exit 0
          fi
          git add state.json
          git diff --cached --quiet || git commit -m "Update weekly review state [skip ci]"
          git push
